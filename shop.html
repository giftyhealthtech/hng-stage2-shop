<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | Maison Étoile</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="shop">
    <header class="topbar">
      <div class="container navbar">
        <a href="index.html" class="brand">Maison Étoile</a>
        <nav class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="login.html">Login</a>
        </nav>
        <div class="nav-actions">
          <a class="cart-pill" href="cart.html">Cart <span class="cart-count">0</span></a>
        </div>
      </div>
    </header>

    <main>
      <section class="page-header">
        <div class="container">
          <span class="eyebrow">The collection</span>
          <h1>Shop all pieces</h1>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="featured-banner">
            <div>
              <span class="eyebrow">Featured edit</span>
              <h2>Soft tailoring for everyday rituals</h2>
            </div>
            <a class="btn" href="#product-grid">Shop the edit</a>
          </div>

          <div class="shop-controls">
            <div class="search-box">
              <input id="shop-search" type="search" placeholder="Search products" aria-label="Search products" />
            </div>

            <div class="sorting-box">
              <label for="sort-price">Sort by</label>
              <select id="sort-price">
                <option value="featured">Featured</option>
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
              </select>
            </div>

            <div id="shop-filters" class="filter-group" aria-label="Product categories"></div>
          </div>

          <div id="product-grid" class="product-grid"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config"></script>
    <script src="js/supabase.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
